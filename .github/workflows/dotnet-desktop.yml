name: .NET Build & Test

# Khi nào workflow chạy
on:
  push:
    branches: [ master, develop, release/* ]
  pull_request:
    branches: [ master, develop, release/* ]

jobs:
  build:
    runs-on: windows-latest   # vì bạn code C# nên dùng Windows runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '8.0.x'   # hoặc '8.0.x' nếu bạn dùng .NET 8

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Run tests
      run: dotnet test --no-build --verbosity normal
